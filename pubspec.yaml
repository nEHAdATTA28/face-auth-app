name: face_auth_app
description: A Flutter face authentication app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  camera: ^0.10.5+7
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.0.0
  http: ^1.1.0

  # ML
  tflite_flutter: ^0.12.1
  image: ^4.1.3

  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/face_classifier.tflite
    - assets/models/face_classifier_labels.txt  